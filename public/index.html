<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYOKA Audio Node</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e1015;
            color: #e4e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161922;
            border: 1px solid #232838;
            border-radius: 12px;
            padding: 36px 44px;
            text-align: center;
            max-width: 440px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            background-color: #10382b;
            color: #2ed573;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 { margin: 0 0 8px 0; font-size: 22px; color: #ffffff; }
        p { margin: 0; font-size: 14px; color: #8b949e; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Node Operational</span>
        <h1>KYOKA Lavalink V4</h1>
        <p>Dedicated high-performance audio engine for the KYOKA Discord Bot.</p>
    </div>
</body>
</html>
