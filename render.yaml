# ==============================================================================
# RENDER BLUEPRINT - KYOKA LAVALINK V4 (FREE TIER)
# ==============================================================================
# Plan: free (Zero unexpected charges, 100% Free Web Service)
# Architecture: Dual-layer (Nginx Edge Gateway + Isolated Lavalink Loopback Backend)
# Healthcheck: /healthz (Public HTTP check served by Nginx verifying backend health)
# ==============================================================================

services:
  - type: web
    name: kyoka-lavalink
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LAVALINK_SERVER_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms96m -XX:MaxMetaspaceSize=72m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -Xss384k -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError -XX:+UseStringDeduplication"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
