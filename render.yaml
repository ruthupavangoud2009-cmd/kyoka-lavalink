# ==============================================================================
# RENDER BLUEPRINT - KYOKA LAVALINK V4 (FREE TIER)
# ==============================================================================
# IMPORTANT:
# - Plan: free (Zero unexpected charges, 100% Free Web Service)
# - Memory: 512 MB Container RAM limit (Optimized JVM heap -Xmx384m)
# - Healthcheck: Omitted on purpose. Render natively validates container readiness
#   via TCP port check on 0.0.0.0:$PORT. This prevents unauthenticated HTTP 401
#   errors from Render's health checker while keeping Lavalink fully password-protected.
# ==============================================================================

services:
  - type: web
    name: kyoka-lavalink
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: LAVALINK_SERVER_PASSWORD
        generateValue: true
      - key: JAVA_OPTS
        value: "-Xmx384m -Xms128m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError -XX:+UseStringDeduplication"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
